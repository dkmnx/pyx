# Pre-commit hooks for pyx
# Only runs on Rust source files, not config/docs

repos:
  - repo: local
    hooks:
      - id: rust-fmt
        name: Rust Format
        entry: cargo fmt -- --check
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

      - id: rust-clippy
        name: Rust Clippy
        entry: cargo clippy -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

      - id: rust-test
        name: Rust Tests
        entry: cargo test --lib
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

exclude: |
  (?x)^(
    docs/.*|
    \.github/.*|
    \.gitignore|
    \.pre-commit-config\.yaml|
    AGENTS\.md|
    CHANGELOG\.md|
    README\.md|
    justfile|
    Cargo\.toml|
  )$
