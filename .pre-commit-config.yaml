# Pre-commit hooks for pyx
# Only runs on Rust source files, not config/docs

repos:
  - repo: local
    hooks:
      - id: just-check
        name: Run just check
        entry: just check
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

exclude: |
  (?x)^(
    docs/.*|
    \.github/.*|
    \.gitignore|
    \.pre-commit-config\.yaml|
    AGENTS\.md|
    CHANGELOG\.md|
    README\.md|
    justfile|
    Cargo\.toml|
  )$
