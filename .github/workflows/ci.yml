name: CI

on:
  push:
    branches: [main, master]
    tags-ignore: ['v*']
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Lint the workflow file itself
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-actionlint@v1

  # Full checks on Linux
  linux:
    name: Linux (full)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "pyx-ci"
          cache-targets: true

      - name: Check formatting
        run: just fmt-check

      - name: Run clippy
        run: just lint

      - name: Run tests
        run: just test-all

      - name: Build
        run: just build-prod

  # Build and smoke tests on macOS
  macos:
    name: macOS (build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "pyx-ci"
          cache-targets: true

      - name: Check formatting
        run: just fmt-check

      - name: Run clippy
        run: just lint

      - name: Run unit tests
        run: just test

      - name: Build
        run: just build-prod

  # Build and smoke tests on Windows
  windows:
    name: Windows (build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "pyx-ci"
          cache-targets: true

      - name: Check formatting
        run: just fmt-check

      - name: Run clippy
        run: just lint

      - name: Run unit tests
        run: just test

      - name: Build
        run: just build-prod
