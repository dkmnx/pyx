[package]
name = "pyx-rust"
version = "0.1.0"
edition = "2024"

[lib]
path = "src-rust/lib.rs"

[[bin]]
name = "pyx"
path = "src-rust/main.rs"

[[bin]]
name = "crypto-spike"
path = "src-rust/bin/crypto-spike.rs"

[dependencies]
# CLI parsing
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Error handling
thiserror = "2.0"
# Keyring integration
keyring = "3.6"
# Secret handling
secrecy = { version = "0.10", features = ["serde"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
# Interactive prompts
inquire = "0.9"
# HTTP client
ureq = { version = "2.10", features = ["json"] }
# Age encryption (for crypto compatibility)
age = { version = "0.11", features = ["armor"] }
age-core = "0.11"
scrypt = "0.11"
# Regex for session parsing
regex = "1.11"
# Time handling
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
# PATH lookup
which = "7.0"
# Home directory
dirs = "6.0"
# Lazy static initialization
once_cell = "1.20"
# Hex encoding/decoding
hex = "0.4"
# Random number generation
getrandom = "0.3"
# Temp dirs/files for testing
tempfile = "3.15"
# Testing utilities
assert_cmd = "2.0"
predicates = "3.1"
# Base64 encoding (matches Go implementation format)
base64 = "0.22.1"

[dev-dependencies]
# Snapshot testing
insta = "1.42"
# HTTP mocking
mockito = "1.6"
