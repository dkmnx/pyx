[package]
name = "pyx-rs"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "pyx"
path = "src/main.rs"

[dependencies]
# CLI parsing
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Error handling
thiserror = "2.0"
# Native OS keyring access
# Uses keyring crate which provides:
#   Linux: Secret Service (gnome-keyring/kwallet) via D-Bus + kernel keyutils fallback
#   macOS: Keychain via Security.framework
#   Windows: Credential Manager via WinCred API
# Build dependency on Linux: libdbus-1-dev, pkg-config (or use vendored feature to static-link)
keyring = { version = "3", features = ["sync-secret-service", "linux-native", "crypto-rust", "vendored"] }
# Secret handling
secrecy = { version = "0.10", features = ["serde"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
# Interactive prompts
inquire = "0.9"
# HTTP client
ureq = { version = "3.0", features = ["json"] }
# Age encryption (for crypto compatibility)
age = { version = "0.11", features = ["armor"] }
scrypt = "0.11"
# ChaCha20-Poly1305 for v2 key encryption
chacha20poly1305 = "0.10"
# Regex for session parsing
regex = "1.11"
# Time handling
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
# PATH lookup
which = "8.0"
# Home directory
dirs = "6.0"
# Hex encoding/decoding
hex = "0.4"
# Random number generation
getrandom = "0.4"
# Temp dirs/files for atomic writes
tempfile = "3.15"
# Base64 encoding (matches Go implementation format)
base64 = "0.22.1"
# Terminal colors
owo-colors = "4.2"
# Constant-time comparison
subtle = "2.6"

[dev-dependencies]
# Testing utilities
assert_cmd = "2.0"
predicates = "3.1"
# Snapshot testing
insta = "1.42"
# HTTP mocking
mockito = "1.6"
